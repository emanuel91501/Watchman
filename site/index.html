<!doctype html>
<html lang="en" data-theme="dark">
<head>

<meta name="description" content="A public reading room of the present: the world as it stands right now, read from Watchman's hourly engine.">

<script>(function(){try{var s=JSON.parse(localStorage.getItem('wm.state')||'null');var t=s&&s.settings&&s.settings.theme;if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<style>

<style>
/* tokens.css — M1 (Fable pick: M1-B skin + A2 rhythm + C depth). The ONLY colour source in the build.
   Meaning hues: world vermilion, U.S. sky, Indiana green, Washington amber, money lime, library lilac. */
:root, :root[data-theme="dark"] {
  --bg: #000000;
  --surface-1: #111113;
  --surface-2: #19191c;
  --surface-3: #232327;
  --rule: #26262a;
  --rule-strong: #6a6a72;
  --ink-1: #f2f0ea;
  --ink-2: #a8a49c;
  --ink-3: #8f8c86;
  --accent: #ff5a3c;
  --accent-ink: #000000;
  --stale: #f5c518;
  --bad: #ff6b5a;
  --world: #ff5a3c;
  --us: #4da3ff;
  --indiana: #3ddc84;
  --washington: #f5c518;
  --money: #c9f04d;
  --library: #b9a6ff;
  --elsewhere: #ff7a9c;
  --block-mix: 13%;
  --card: #141416;
  --on-photo: #ffffff;
  --on-photo-2: #e4e2dc;
  --scrim: rgba(0, 0, 0, 0.62);
  --shade-top: rgba(0, 0, 0, 0.55);
  --shade-bot: rgba(0, 0, 0, 0.92);
  --glass: rgba(22, 22, 24, 0.84);
  --glass-line: rgba(255, 255, 255, 0.14);
  --map-sea: #0b0b0d;
  --map-land: #232327;
  --map-line: #000000;
  --map-grat: #19191c;
  --sig-ring: #ff5a3c;
  --sev-1: #8f8c86;
  --sev-2: #f5c518;
  --sev-3: #ff8a5c;
  --sev-4: #ff5a3c;
  --hatch: #6a6a72;
  --sel: #f2f0ea;
  --f-head: "Instrument Serif", serif;
  --f-read: "Newsreader", serif;
  --f-ui: "Geist", sans-serif;
  --f-num: "Instrument Serif", serif;
  --r-card: 16px;
  --r-sheet: 24px;
  --gutter: 16px;
  --pad-bottom: 120px;
  --dur-body: 200ms;
  --dur-sheet: 240ms;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
}
:root[data-theme="light"] {
  --bg: #faf8f3;
  --surface-1: #f1eee6;
  --surface-2: #efebe3;
  --surface-3: #ebe7de;
  --rule: #e0dbd0;
  --rule-strong: #77736a;
  --ink-1: #121212;
  --ink-2: #4a4740;
  --ink-3: #5e5a52;
  --accent: #b02a14;
  --accent-ink: #ffffff;
  --stale: #6e5a00;
  --bad: #b3261e;
  --world: #b02a14;
  --us: #0a54a3;
  --indiana: #08683c;
  --washington: #6e5a00;
  --money: #3d5800;
  --library: #5b45c4;
  --elsewhere: #a3264d;
  --block-mix: 9%;
  --card: #ffffff;
  --on-photo: #ffffff;
  --on-photo-2: #e4e2dc;
  --scrim: rgba(18, 18, 18, 0.42);
  --shade-top: rgba(0, 0, 0, 0.5);
  --shade-bot: rgba(0, 0, 0, 0.9);
  --glass: rgba(250, 248, 243, 0.9);
  --glass-line: rgba(0, 0, 0, 0.1);
  --map-sea: #f1eee6;
  --map-land: #d6d1c4;
  --map-line: #faf8f3;
  --map-grat: #e9e5db;
  --sig-ring: #b02a14;
  --sev-1: #5e5a52;
  --sev-2: #6e5a00;
  --sev-3: #b8501f;
  --sev-4: #b02a14;
  --hatch: #8a857a;
  --sel: #121212;
  --f-head: "Instrument Serif", serif;
  --f-read: "Newsreader", serif;
  --f-ui: "Geist", sans-serif;
  --f-num: "Instrument Serif", serif;
  --r-card: 16px;
  --r-sheet: 24px;
  --gutter: 16px;
  --pad-bottom: 120px;
  --dur-body: 200ms;
  --dur-sheet: 240ms;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
}

/* M2: Washington status rail hues (Presented / Signed / Published) */
:root, :root[data-theme="dark"] { --st-presented: #b9a6ff; --st-signed: #4fd18b; --st-published: #4da3ff; --spine: #2c2c31; }
:root[data-theme="light"] { --st-presented: #6a4fd6; --st-signed: #1f8a4c; --st-published: #1f6fd1; --spine: #d9d4c7; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --st-presented: #6a4fd6; --st-signed: #1f8a4c; --st-published: #1f6fd1; --spine: #d9d4c7; } }
.rail--president.is-on { --c: var(--st-presented); } .rail--signed.is-on { --c: var(--st-signed); } .rail--fr_published.is-on { --c: var(--st-published); }

/* M3: ink on a solid section-hue block, and the photo credit chip (moved here from ui.css: colour lives only in tokens) */
:root, :root[data-theme="dark"] { --on-hue: #0b0b0c; --on-hue-2: rgba(11, 11, 12, .74); --credit-bg: rgba(0, 0, 0, .58); --credit-ink: #ece9e2; }
:root[data-theme="light"] { --on-hue: #ffffff; --on-hue-2: rgba(255, 255, 255, .84); --credit-bg: rgba(0, 0, 0, .58); --credit-ink: #ece9e2; }
/* M5-C Front Page: the masthead set over the cover photo uses the BRIGHT desk hue in both themes (the shade under it is always black) */
:root { --mast-world: #ff6a4d; --mast-us: #6db4ff; --mast-indiana: #4fe394; --mast-washington: #f7cf3a; --mast-money: #d2f466; --cover-shade: rgba(0, 0, 0, .78); --cover-shade-0: rgba(0, 0, 0, 0); --tk-bg: var(--surface-1); }

/* M5 cover ink: the cover sits on a photo in both themes, so its ink is fixed (moved here from ui.css: one colour source) */
:root { --cv-black: #000; --cv-white: #fff; --cv-ink-2: #f2f0ea; --cv-ink-3: #e4e2dc; --cv-ink-4: #bdbab3; --cv-rule: rgba(255, 255, 255, .38); --cv-glow: rgba(0, 0, 0, .35); }

/* ui.css — the whole M1 interface. Colours come only from tokens.css. Type: Instrument Serif (display), Newsreader (long
   reads), Geist (UI). Nothing animates except the pill/Contents sheet, the screen crossfade and the map's three newest rings. */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink-1); font-family: var(--f-ui); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { display: block; max-width: 100%; height: auto; }
table { border-collapse: collapse; }
.wm-skip { position: absolute; left: -999px; top: 0; }
.wm-skip:focus { left: 8px; z-index: 50; background: var(--surface-1); padding: 8px 12px; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }

/* text slots (kernel/text.js) */
.t-wrap { overflow-wrap: anywhere; }
.t-fit { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.t-lines-1, .t-lines-2, .t-lines-3, .t-lines-4 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.t-lines-1 { -webkit-line-clamp: 1; } .t-lines-2 { -webkit-line-clamp: 2; } .t-lines-3 { -webkit-line-clamp: 3; } .t-lines-4 { -webkit-line-clamp: 4; }

/* shell */
.wm-body { display: block; max-width: 640px; margin: 0 auto; padding-bottom: var(--pad-bottom); min-height: 100vh; }
.wm-body.is-leaving { visibility: hidden; }
.wm-gutter { padding-left: var(--gutter); padding-right: var(--gutter); }
.wm-topbar { position: sticky; top: 0; z-index: 8; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 var(--gutter); background: var(--bg); border-bottom: 1px solid var(--rule); }
.wm-topbar__back { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; min-width: 44px; font-size: 14px; color: var(--ink-2); }
.wm-topbar__back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.wm-topbar__title { flex: 1; font-family: var(--f-head); font-size: 22px; line-height: 1; text-align: center; }
.wm-topbar__stamp { font-size: 12px; color: var(--ink-3); min-width: 44px; text-align: right; }

/* bottom: ONE "Today" pill that opens the Contents sheet */
.wm-tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none; }
.wm-bar__scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; visibility: hidden; transition: opacity var(--dur-sheet) var(--ease-out), visibility 0s var(--dur-sheet); pointer-events: auto; }
.wm-tabs.is-open .wm-bar__scrim { opacity: 1; visibility: visible; transition: opacity var(--dur-sheet) var(--ease-out); }
.wm-bar__dock { position: relative; max-width: 460px; margin: 0 auto; padding: 0 12px calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; }
.wm-tabs:not(.is-ready) .wm-pill { visibility: hidden; }
.wm-pill { pointer-events: auto; display: inline-flex; align-items: center; gap: 10px; height: 50px; padding: 0 22px 0 18px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px); color: var(--ink-1); }
.wm-pill__dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: 0 0 9px; }
.wm-pill__label { font-family: var(--f-head); font-size: 25px; line-height: 1; }
.wm-pill__crumb { font-size: 13px; color: var(--ink-2); }
.wm-pill__crumb:empty { display: none; }
.wm-sheet { pointer-events: auto; width: 100%; margin-bottom: 12px; padding: 18px 16px 8px; border-radius: var(--r-sheet); border: 1px solid var(--glass-line); background: var(--surface-1); transform-origin: 50% 100%; transform: translateY(16px) scale(.92); opacity: 0; visibility: hidden; transition: transform var(--dur-sheet) var(--ease-out), opacity var(--dur-sheet) var(--ease-out), visibility 0s var(--dur-sheet); max-height: calc(100vh - 120px); overflow-y: auto; }
.wm-tabs.is-open .wm-sheet { transform: none; opacity: 1; visibility: visible; transition: transform var(--dur-sheet) var(--ease-out), opacity var(--dur-sheet) var(--ease-out); }
.wm-sheet__k { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); padding: 0 4px 10px; }
.wm-tab { display: grid; grid-template-columns: 30px 1fr auto 56px; gap: 10px; align-items: center; min-height: 60px; padding: 8px 4px; border-top: 1px solid var(--rule); }
.wm-tab[aria-current="page"] .wm-tab__t { color: var(--accent); }
.wm-tab__n { font-size: 13px; font-weight: 500; color: var(--hue, var(--accent)); }
.wm-tab__t { font-family: var(--f-head); font-size: 29px; line-height: 1; }
.wm-tab__c { font-size: 13px; color: var(--ink-2); text-align: right; }
.wm-tab__img { width: 56px; height: 42px; border-radius: 6px; object-fit: cover; background: var(--surface-2); }
.wm-tab__spark { width: 56px; height: 42px; border-radius: 6px; background: var(--surface-2); display: flex; align-items: center; padding: 0 4px; }
.wm-tab__spark svg { width: 100%; height: 30px; }
.wm-tab__spark .mp { background: transparent; } .wm-tab__spark .mp svg { height: 42px; width: 48px; }
.wm-tab__glyph { font-family: var(--f-head); font-size: 28px; line-height: 1; color: var(--library); margin: 0 auto; }
.wm-tab--set { grid-template-columns: 1fr; min-height: 48px; font-size: 14px; color: var(--ink-2); }

/* hues by section */
.h-world { --hue: var(--world); } .h-us { --hue: var(--us); } .h-indiana { --hue: var(--indiana); } .h-washington { --hue: var(--washington); }
.h-money { --hue: var(--money); } .h-library { --hue: var(--library); } .h-map { --hue: var(--accent); }

/* type */
.kick { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--hue, var(--accent)); }
.meta { font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.meta b { font-weight: 500; color: var(--ink-1); }
.truth { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .04em; padding: 1px 7px; border-radius: 5px; border: 1px solid var(--rule-strong); color: var(--ink-1); }
.truth--record { border-color: var(--us); color: var(--us); }
.truth--report { border-color: var(--world); color: var(--world); }
.truth--judgement { border-color: var(--library); color: var(--library); }
.disp { font-family: var(--f-head); font-weight: 400; line-height: 1.02; letter-spacing: -.005em; }
.dek { font-family: var(--f-read); font-size: 17px; line-height: 1.45; color: var(--ink-2); }
.credit { display: block; font-size: 12px; color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* cover: a column, so the headline, cover lines and credit can never overlap whatever the headline length */
.cover { position: relative; display: flex; flex-direction: column; min-height: 844px; overflow: hidden; background: var(--bg); color: var(--on-photo); }
.cover__img { position: absolute; inset: 0; width: 100%; height: 100% !important; object-fit: cover; object-position: 50% 35%; }
.cover__shade { position: absolute; inset: 0; background: linear-gradient(180deg, var(--shade-top) 0%, transparent 26%, transparent 34%, var(--shade-bot) 66%, var(--bg) 100%); }
:root[data-theme="light"] .cover__shade { background: linear-gradient(180deg, var(--shade-top) 0%, transparent 26%, transparent 34%, var(--shade-bot) 70%); }
.mast { position: relative; padding: 48px var(--gutter) 0; text-align: center; }
.mast__date, .mast__ed { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--on-photo-2); }
.mast__name { font-family: var(--f-head); font-size: 64px; line-height: .95; letter-spacing: -.02em; margin: 6px 0; color: var(--on-photo); }
.cover__foot { position: relative; margin-top: auto; padding: 0 var(--gutter) 86px; }
.cover__story { display: block; }
.cover__story .disp { font-size: 40px; color: var(--on-photo); margin-top: 8px; }
.cover__story .meta { color: var(--on-photo-2); margin-top: 10px; }
.cover__lines { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--glass-line); }
.cl { display: block; min-width: 0; }
.cl img { width: 100%; height: auto; aspect-ratio: 16/10; object-fit: cover; border-radius: 4px; margin-bottom: 6px; }
.cl__t { font-size: 13px; line-height: 1.3; color: var(--on-photo); }
.cover .credit { margin-top: 10px; text-align: right; color: var(--on-photo-2); }
.cover__story .kick { --hue: var(--world); }
.mast .mast__ed.kick { color: var(--indiana); letter-spacing: .14em; }
.mast__live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--indiana); margin-right: 8px; vertical-align: 1px; }
.cover--text { min-height: 0; color: var(--ink-1); }
.cover--text .mast__name, .cover--text .cover__story .disp, .cover--text .cl__t { color: var(--ink-1); }
.cover--text .mast__date, .cover--text .mast__ed, .cover--text .cover__story .meta { color: var(--ink-2); }
.cover--text .cover__foot { padding-top: 40px; padding-bottom: 20px; }
.cl .kick { color: var(--hue); }

/* live stamp under the cover */
.stamp { display: flex; align-items: center; gap: 10px; padding: 14px var(--gutter); border-bottom: 1px solid var(--rule); font-size: 13px; color: var(--ink-2); }
.stamp__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--indiana); flex: 0 0 8px; }

/* section opener (hue kicker + serif title + dek) */
.sec { padding-top: 34px; }
.opener { padding: 0 var(--gutter) 16px; }
.opener__t { font-family: var(--f-head); font-size: 48px; line-height: 1; color: var(--hue, var(--ink-1)); margin-top: 4px; }
.opener__d { font-size: 14px; color: var(--ink-2); margin-top: 8px; }
.front { padding: 28px var(--gutter) 20px; border-bottom: 1px solid var(--rule); }
.front .opener__t { font-size: 56px; }
.front .dek { margin-top: 12px; }

/* lead card: full-bleed photo */
.lead { display: block; margin: 0 0 6px; }
.lead__img { width: 100%; height: auto; aspect-ratio: 3/2; object-fit: cover; background: var(--surface-1); }
.lead__txt { padding: 14px var(--gutter) 18px; }
.lead__t { font-family: var(--f-head); font-size: 30px; line-height: 1.04; margin: 6px 0 8px; }
.lead .credit { padding: 6px var(--gutter) 0; }
.lead .dek { font-size: 16px; }
.lead .meta { margin-top: 10px; }

/* thumb row: photo right */
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 14px; padding: 14px var(--gutter); border-top: 1px solid var(--rule); align-items: start; }
.trow--text { grid-template-columns: minmax(0, 1fr); }
.trow__img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; background: var(--surface-1); }
.trow__t { font-family: var(--f-read); font-weight: 500; font-size: 18px; line-height: 1.26; margin: 4px 0 6px; }
.trow .meta { font-size: 12px; }

/* record row with ruled status column */
.recs { margin: 0 var(--gutter); border-top: 1px solid var(--rule-strong); }
.rrow { display: grid; grid-template-columns: 56px minmax(0, 1fr) 92px; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.rrow__d { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); padding-top: 3px; }
.rrow__t { font-family: var(--f-read); font-weight: 500; font-size: 16px; line-height: 1.3; }
.rrow .meta { font-size: 12px; margin-top: 4px; }
.rrow__s { border-left: 1px solid var(--rule-strong); padding-left: 10px; font-size: 13px; font-weight: 600; color: var(--st, var(--ink-1)); }
.rrow__s small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-2); }
.recs__head { display: grid; grid-template-columns: 56px minmax(0, 1fr) 92px; gap: 10px; padding: 8px 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); border-bottom: 1px solid var(--rule); }
.recs__head span:last-child { border-left: 1px solid var(--rule-strong); padding-left: 10px; }
.st-open { --st: var(--indiana); } .st-closed { --st: var(--ink-2); } .st-scheduled { --st: var(--us); } .st-pending { --st: var(--washington); }

/* Washington branch badges */
.branch { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding: 18px var(--gutter) 10px; align-items: center; }
.badge { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--surface-2); border: 1px solid var(--washington); font-family: var(--f-head); font-size: 26px; color: var(--washington); }
.badge img { width: 100%; height: 100%; object-fit: cover; }
.branch__t { font-family: var(--f-head); font-size: 30px; line-height: 1; }
.note { margin: 8px var(--gutter); padding: 10px 12px; border-left: 2px solid var(--stale); font-size: 13px; color: var(--ink-2); background: var(--surface-1); }

/* ballot / end tables */
.etable { width: calc(100% - 2 * var(--gutter)); margin: 26px var(--gutter) 0; font-size: 14px; }
.etable caption { text-align: left; font-family: var(--f-head); font-size: 28px; padding-bottom: 10px; caption-side: top; }
.etable th { text-align: left; font-weight: 500; color: var(--ink-2); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 10px 10px 10px 0; border-top: 1px solid var(--rule); vertical-align: top; width: 36%; }
.etable td { padding: 10px 0; border-top: 1px solid var(--rule); vertical-align: top; overflow-wrap: anywhere; }
.etable td small { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.etable .num { font-family: var(--f-num); font-size: 22px; line-height: 1.1; }
.etable--wide th { width: auto; }
.leads { margin: 30px var(--gutter) 0; padding-top: 18px; border-top: 3px solid var(--ink-1); }
.leads__t { font-family: var(--f-head); font-size: 30px; }
.leads a { display: block; padding: 12px 0; min-height: 44px; border-bottom: 1px solid var(--rule); font-family: var(--f-read); font-size: 17px; line-height: 1.3; }
.leads a .meta { display: block; font-family: var(--f-ui); margin-top: 3px; font-size: 12px; }

/* ballot band */
.ballot { margin: 6px var(--gutter) 0; padding: 18px 0 4px; border-top: 3px solid var(--indiana); }
.ballot .etable { width: 100%; margin: 14px 0 0; }
.ballot__count { font-family: var(--f-num); font-size: 56px; line-height: .9; color: var(--indiana); }

/* map */
.mapbox { background: var(--map-sea); margin-top: 6px; }
.mp { display: block; position: relative; width: 100%; background: var(--map-sea); }
.mp svg { display: block; width: 100%; height: auto; }
.mp__grat { fill: none; stroke: var(--map-grat); stroke-width: .5; }
.mp__land { fill: var(--map-land); stroke: var(--map-line); stroke-width: .5; }
.mp__ext { fill: var(--sev-2); fill-opacity: .25; stroke: var(--sev-2); stroke-width: .8; }
.mp__m { stroke: var(--map-sea); stroke-width: 1; }
.mp__m[data-sev="1"] { fill: var(--sev-1); } .mp__m[data-sev="2"] { fill: var(--sev-2); } .mp__m[data-sev="3"] { fill: var(--sev-3); } .mp__m[data-sev="4"] { fill: var(--sev-4); }
.mp__ring { fill: none; stroke: var(--sig-ring); stroke-width: 1.4; transform-box: fill-box; transform-origin: center; animation: wm-pulse 4s cubic-bezier(.2,.6,.3,1) infinite; }
.mp__lab { font-family: var(--f-ui); font-size: 12px; fill: var(--ink-1); paint-order: stroke; stroke: var(--map-sea); stroke-width: 3px; stroke-linejoin: round; dominant-baseline: central; }
@keyframes wm-pulse { 0% { transform: scale(.7); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 12px var(--gutter) 14px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.lg-4 { background: var(--sev-4); } .lg-3 { background: var(--sev-3); } .lg-2 { background: var(--sev-2); } .lg-1 { background: var(--sev-1); }

/* money */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin: 0 var(--gutter); background: var(--rule); border: 1px solid var(--rule); }
.tile { display: block; background: var(--bg); padding: 14px 12px 12px; min-width: 0; }
.band .tile { background: var(--surface-1); }
.tile__l { font-size: 12px; color: var(--ink-2); line-height: 1.3; min-height: 32px; }
.tile__v { font-family: var(--f-num); font-size: 44px; line-height: 1; margin: 6px 0 2px; }
.tile__v small { font-family: var(--f-ui); font-size: 13px; color: var(--ink-2); margin-left: 4px; }
.tile .meta { font-size: 12px; }
.spark { display: block; width: 100%; height: 36px; margin: 6px 0; }
.spark path { fill: none; stroke: var(--ink-1); stroke-width: 1.4; }
.spark circle { fill: var(--hue, var(--money)); }
.band { background: var(--surface-1); padding-bottom: 22px; }
.band .tiles { background: var(--rule); }
.m-lead { padding: 24px var(--gutter) 22px; border-bottom: 1px solid var(--rule); }
.m-big { font-family: var(--f-num); font-size: 112px; line-height: .86; letter-spacing: -.02em; }
.m-big small { font-size: 44px; color: var(--ink-2); }
.m-lead .spark { height: 84px; }

/* places */
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.pg { position: relative; display: block; aspect-ratio: 3/4; overflow: hidden; background: var(--surface-1); color: var(--on-photo); }
.pg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pg__shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, var(--shade-bot)); }
.pg__t { position: absolute; left: 12px; right: 12px; bottom: 10px; font-family: var(--f-head); font-size: 26px; line-height: 1; color: var(--on-photo); }
.pg__t small { display: block; font-family: var(--f-ui); font-size: 12px; color: var(--on-photo-2); margin-top: 4px; }
.idx { padding: 26px var(--gutter) 0; }
.idx__h { font-family: var(--f-head); font-size: 30px; margin-bottom: 6px; }
.idx a { display: flex; align-items: baseline; gap: 8px; min-height: 44px; padding: 10px 0; border-bottom: 1px solid var(--rule); font-family: var(--f-read); font-size: 17px; }
.idx a span:first-child { flex: 1; }
.idx a span:last-child { font-family: var(--f-ui); font-size: 12px; color: var(--ink-2); }
.hero { position: relative; height: 520px; overflow: hidden; background: var(--surface-1); color: var(--on-photo); }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero__shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, var(--shade-bot)); }
.hero__t { position: absolute; left: var(--gutter); right: var(--gutter); bottom: 34px; }
.hero__t .disp { font-size: 56px; color: var(--on-photo); margin-top: 4px; }
.hero__t .meta { color: var(--on-photo-2); }
.hero .credit { position: absolute; left: var(--gutter); bottom: 10px; color: var(--on-photo-2); }
.hero--text { height: auto; background: var(--bg); color: var(--ink-1); padding: 28px var(--gutter) 10px; }
.hero--text .hero__t { position: static; }
.hero--text .disp { color: var(--ink-1); }

/* story */
.s-hero img { width: 100%; height: auto; aspect-ratio: 4/3; object-fit: cover; background: var(--surface-1); }
.s-hero .credit { padding: 6px var(--gutter) 0; }
.s-head { padding: 20px var(--gutter) 0; }
.s-head .disp { font-size: 40px; margin: 8px 0 10px; }
.s-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; min-height: 44px; font-size: 13px; color: var(--ink-1); border: 1px solid var(--rule-strong); padding: 4px 11px; border-radius: 999px; }
.follow { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 16px; padding: 0 18px; border-radius: 999px; background: var(--ink-1); color: var(--bg); font-size: 14px; font-weight: 600; }
.follow[aria-pressed="true"] { background: transparent; color: var(--ink-1); border: 1px solid var(--rule-strong); }
.body { padding: 22px var(--gutter) 6px; font-family: var(--f-read); font-size: 19px; line-height: 1.55; }
.body p + p { margin-top: 16px; }
.body .lede::first-letter { font-family: var(--f-head); float: left; font-size: 68px; line-height: .82; padding: 6px 8px 0 0; }
.quote { margin: 18px 0; padding-left: 14px; border-left: 2px solid var(--hue, var(--accent)); }
.quote p { font-size: 18px; }
.quote cite { display: block; font-family: var(--f-ui); font-style: normal; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.quote cite a { text-decoration: underline; text-underline-offset: 2px; }
.unfold { margin-top: 26px; padding: 26px var(--gutter); background: var(--surface-1); }
.unfold ol { list-style: none; margin-top: 16px; border-left: 1px solid var(--rule-strong); margin-left: 4px; }
.unfold li { position: relative; padding: 0 0 18px 18px; }
.unfold li::before { content: ""; position: absolute; left: -4px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.unfold li:last-child::before { background: var(--accent); }
.unfold time { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.unfold h4 { font-family: var(--f-read); font-weight: 500; font-size: 16px; line-height: 1.3; margin-top: 2px; }
.unfold h4 a { display: block; min-height: 44px; }
.unfold a { text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }

/* gloss: underlined terms open a sheet with plain words + source */
.gl { font: inherit; color: inherit; text-decoration: underline dotted var(--hue, var(--library)); text-decoration-thickness: 1.5px; text-underline-offset: 3px; padding: 0; display: inline; }
.gsheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-width: 520px; margin: 0 auto; padding: 18px var(--gutter) 36px; background: var(--surface-1); border-top: 1px solid var(--glass-line); border-radius: var(--r-sheet) var(--r-sheet) 0 0; transform: translateY(100%); visibility: hidden; transition: transform var(--dur-sheet) var(--ease-out), visibility 0s var(--dur-sheet); touch-action: none; }
.gsheet.is-open { transform: none; visibility: visible; transition: transform var(--dur-sheet) var(--ease-out); }
.gsheet__grab { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--rule-strong); margin: 0 auto 14px; }
.gsheet__t { font-family: var(--f-head); font-size: 32px; line-height: 1; }
.gsheet__p { font-family: var(--f-read); font-size: 18px; line-height: 1.45; margin: 10px 0; }
.gsheet a { text-decoration: underline; text-underline-offset: 3px; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.gsheet__close { position: absolute; right: 8px; top: 8px; min-width: 44px; min-height: 44px; font-size: 13px; color: var(--ink-2); }
.gscrim { position: fixed; inset: 0; z-index: 29; background: var(--scrim); opacity: 0; visibility: hidden; transition: opacity var(--dur-sheet), visibility 0s var(--dur-sheet); }
.gscrim.is-open { opacity: 1; visibility: visible; transition: opacity var(--dur-sheet); }

/* library */
.desk { margin: 20px var(--gutter) 0; padding: 22px 18px; background: var(--surface-1); border: 1px solid var(--rule); border-radius: var(--r-card); }
.desk__t { font-family: var(--f-head); font-size: 34px; line-height: 1.02; margin: 6px 0 10px; }
.desk p { font-family: var(--f-read); font-size: 17px; line-height: 1.6; color: var(--ink-2); }
.shelves { padding: 30px var(--gutter) 0; }
.shelf { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 14px 0; min-height: 44px; border-bottom: 1px solid var(--rule); }
.shelf__n { font-family: var(--f-num); font-size: 28px; line-height: 1; color: var(--library); }
.shelf__t { font-family: var(--f-read); font-weight: 500; font-size: 18px; line-height: 1.25; }
.reel { display: flex; gap: 12px; overflow-x: auto; padding: 0 var(--gutter) 4px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.reel::-webkit-scrollbar { display: none; }
.reel > a { flex: 0 0 74%; scroll-snap-align: start; }
.reel img { width: 100%; height: auto; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; margin-bottom: 10px; background: var(--surface-1); }
.reel .trow__t { font-size: 17px; }

/* settings */
.set { padding: 0 var(--gutter); }
.set__row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; border-bottom: 1px solid var(--rule); font-size: 16px; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 999px; overflow: hidden; }
.seg button { min-height: 44px; min-width: 64px; padding: 0 14px; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink-1); color: var(--bg); }
.colophon { padding: 30px var(--gutter) 0; text-align: center; font-size: 12px; color: var(--ink-3); }
.more { display: flex; align-items: center; justify-content: space-between; min-height: 48px; margin: 4px var(--gutter) 0; border-top: 1px solid var(--rule); font-size: 14px; font-weight: 500; color: var(--hue, var(--ink-1)); }

@media (prefers-reduced-motion: reduce) {
  .mp__ring { animation: none; }
  .wm-sheet, .wm-bar__scrim, .gsheet, .gscrim { transition: none !important; }
}
:root[data-motion="reduced"] .mp__ring { animation: none; }

/* ================= M2-B "Channels" layer =================
   Each section is a colour block in its meaning hue; bold Geist card heads, serif only for openers and story titles;
   truth word as a coloured dot + word; the pill shrinks to a dot while reading. Light (paper) designed first. */
.h-elsewhere { --hue: var(--elsewhere); }
.ch { margin: 14px 10px 0; padding: 22px 0 10px; border-radius: 22px; background: color-mix(in srgb, var(--hue) var(--block-mix), var(--bg)); overflow: hidden; }
.ch--plain { background: transparent; margin: 14px 0 0; border-radius: 0; }
.ch .opener { padding: 0 16px 14px; }
.ch .opener__t { font-size: 44px; }
.ch .lead { margin: 0 10px 10px; border-radius: 16px; overflow: hidden; background: var(--card); }
.ch .lead .credit { padding: 6px 14px 0; }
.ch .lead__txt { padding: 12px 14px 16px; }
.lead__t, .ch .lead__t { font-family: var(--f-ui); font-weight: 700; font-size: 22px; line-height: 1.18; letter-spacing: -.01em; }
.trow__t { font-family: var(--f-ui); font-weight: 650; font-size: 17px; line-height: 1.28; letter-spacing: -.005em; }
.g4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 10px 10px; }
.g4__c { display: flex; flex-direction: column; min-width: 0; background: var(--card); border-radius: 14px; overflow: hidden; padding-bottom: 12px; }
.g4__img { width: 100%; height: auto; aspect-ratio: 4/3; object-fit: cover; background: var(--surface-2); }
.g4__t { font-family: var(--f-ui); font-weight: 700; font-size: 16px; line-height: 1.24; letter-spacing: -.005em; margin: 10px 12px 6px; }
.g4__c .meta { margin: 2px 12px 0; font-size: 12px; }
.ruled { list-style: none; margin: 4px 16px 6px; padding: 0; border-top: 2px solid var(--hue, var(--ink-1)); }
.ruled li a { display: grid; grid-template-columns: 74px minmax(0, 1fr); column-gap: 12px; row-gap: 4px; padding: 12px 0; border-bottom: 1px solid color-mix(in srgb, var(--hue, var(--ink-3)) 30%, var(--rule)); min-height: 44px; }
.ruled__d { grid-row: span 2; font-size: 12px; font-weight: 600; color: var(--hue, var(--ink-2)); letter-spacing: .02em; padding-top: 2px; }
.ruled__t { font-weight: 600; font-size: 15px; line-height: 1.3; color: var(--ink-1); }
.ruled .meta { font-size: 12px; }
.ch .branch, .ch .recs, .ch .tiles, .ch .desk, .ch .mapbox, .ch .more, .ch .ballot { position: relative; }
.ch .desk { background: var(--card); margin-left: 10px; margin-right: 10px; border-radius: 16px; }
.ch .recs { background: var(--card); margin: 0 10px 10px; border-radius: 14px; overflow: hidden; }
.ch .ballot { margin: 0 10px 12px; padding: 16px 14px; border-radius: 16px; background: var(--card); }
.ch .etable--wide { width: 100%; }
/* truth word: a dot + word, never an outlined pill */
.truth { border: 0 !important; padding: 0; border-radius: 0; font-weight: 600; letter-spacing: .02em; display: inline-flex; align-items: center; gap: 5px; }
.truth::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: 0 0 7px; }
/* stories: photo mosaic + dated spine */
.mosaic { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 10px 10px; }
.mosaic__c { background: var(--card); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; padding-bottom: 12px; min-width: 0; }
.mosaic__c--big { grid-column: 1 / -1; }
.mosaic__img { width: 100%; height: auto; aspect-ratio: 4/3; object-fit: cover; }
.mosaic__c--big .mosaic__img { aspect-ratio: 3/2; }
.mosaic__c--big .g4__t { font-size: 22px; }
.mosaic__txt .kick { margin: 10px 12px 0; }
.mosaic__txt .meta { margin: 0 12px; font-size: 12px; }
.spine { padding: 0 0 0 0; }
.spine__day { position: relative; margin-left: 16px; padding-left: 14px; border-left: 2px solid var(--hue); }
.spine__day::before { content: ""; position: absolute; left: -6px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--hue); }
.spine__date { font-family: var(--f-head); font-size: 26px; line-height: 1; padding: 0 0 4px; color: var(--ink-1); }
.spine .ruled { margin-left: 0; border-top-width: 1px; }
/* the pill: shrinks to a 44 px dot while reading down, a mask keeps text clear above it */
.wm-tabs::before { content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 96px; pointer-events: none; background: linear-gradient(to top, var(--bg) 18%, color-mix(in srgb, var(--bg) 0%, transparent)); }
.wm-pill { transition: width var(--dur-body) var(--ease-out), padding var(--dur-body) var(--ease-out), height var(--dur-body) var(--ease-out); }
.wm-tabs.is-mini:not(.is-open) .wm-pill { width: 44px; height: 44px; padding: 0; justify-content: center; gap: 0; }
.wm-tabs.is-mini:not(.is-open) .wm-pill__label, .wm-tabs.is-mini:not(.is-open) .wm-pill__crumb { display: none; }
.wm-tabs.is-mini:not(.is-open) .wm-pill__dot { width: 12px; height: 12px; flex-basis: 12px; }
/* Contents rows preview their section's colour block */
.wm-tab:not(.wm-tab--set) { background: color-mix(in srgb, var(--hue, var(--accent)) var(--block-mix), var(--surface-1)); border-top: 0; border-radius: 14px; margin-top: 6px; padding: 8px 8px 8px 10px; border-left: 4px solid var(--hue, var(--accent)); }
.wm-tab__t { color: var(--ink-1); }
/* light: the cover meta sits on a scrim so the credit reads */
.cover .credit { background: var(--scrim); color: var(--on-photo); padding: 2px 6px; border-radius: 4px; }

/* ================= M2 merge: from M2-C (status hues, clock rule, threaded Washington rows) ================= */
.runrule { display: flex; align-items: center; flex-wrap: wrap; gap: 0 6px; margin-top: 14px; padding: 9px 0; border-top: 1px solid var(--ink-1); border-bottom: 1px solid var(--rule); font-size: 13px; color: var(--ink-2); }
.runrule b { color: var(--ink-1); font-weight: 600; }
.runrule__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--indiana); margin-right: 2px; }
.tiles--wire .tile { margin: 0; }
.wthreads { margin-top: 22px; }
.thr { display: block; padding: 16px var(--gutter); border-top: 1px solid var(--rule); color: inherit; text-decoration: none; }
.thr__t { font-family: var(--f-ui); font-size: 17px; font-weight: 600; line-height: 1.28; color: var(--ink-1); }
.rail { list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); margin: 12px 0 8px; padding: 0; position: relative; }
.rail::before { content: ""; position: absolute; left: 6px; right: 33%; top: 6px; height: 2px; background: var(--rule-strong); opacity: .5; }
.rail__s { position: relative; display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--ink-3); }
.rail__dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--rule-strong); background: var(--bg); box-sizing: border-box; margin-bottom: 4px; position: relative; }
.rail__w { font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.rail__d { color: var(--ink-2); }
.rail__s.is-on .rail__dot { background: var(--c); border-color: var(--c); }
.rail__s.is-on .rail__w { color: var(--c); }
.rail__s.is-on .rail__d { color: var(--ink-1); }

/* ================= M2 merge: from M2-A (Related shelf) ================= */
/* Related shelf: three photos, same thread / place / topic */
.shelf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 6px var(--gutter) 14px; }
.shelf__i { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.shelf__img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 10px; background: var(--surface-2); }
.shelf__t { font-size: 14px; line-height: 1.25; font-weight: 600; color: var(--ink-1); }
.shelf .meta { font-size: 12px; }

/* ================= M2 merge: light theme cover, designed (paper masthead → framed photo → ink headline), not a token swap ================= */
:root[data-theme="light"] .cover:not(.cover--text) { min-height: 0; color: var(--ink-1); padding-top: 4px; }
:root[data-theme="light"] .cover:not(.cover--text) .mast { order: 0; }
:root[data-theme="light"] .cover:not(.cover--text) .cover__img { order: 1; position: relative; inset: auto; display: block; width: calc(100% - 2 * var(--gutter)); height: auto !important; aspect-ratio: 4 / 3; margin: 18px var(--gutter) 0; border-radius: 14px; box-shadow: 0 1px 0 var(--rule), 0 18px 40px -24px color-mix(in srgb, var(--ink-1) 40%, transparent); }
:root[data-theme="light"] .cover:not(.cover--text) .cover__shade { display: none; }
:root[data-theme="light"] .cover:not(.cover--text) .cover__foot { order: 2; margin-top: 0; padding: 16px var(--gutter) 22px; }
:root[data-theme="light"] .cover:not(.cover--text) .mast__name, :root[data-theme="light"] .cover:not(.cover--text) .cover__story .disp, :root[data-theme="light"] .cover:not(.cover--text) .cl__t { color: var(--ink-1); text-shadow: none; }
:root[data-theme="light"] .cover:not(.cover--text) .mast__date, :root[data-theme="light"] .cover:not(.cover--text) .cover__story .meta { color: var(--ink-2); text-shadow: none; }
:root[data-theme="light"] .cover:not(.cover--text) .cover__story .disp { font-size: 36px; }
:root[data-theme="light"] .cover:not(.cover--text) .cover__lines { border-top-color: var(--rule); }
:root[data-theme="light"] .cover:not(.cover--text) .credit { order: 3; background: none; color: var(--ink-3); padding: 0; text-align: left; margin-top: 12px; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) .cover:not(.cover--text) { min-height: 0; color: var(--ink-1); padding-top: 4px; }
  :root:not([data-theme="dark"]) .cover:not(.cover--text) .mast { order: 0; }
  :root:not([data-theme="dark"]) .cover:not(.cover--text) .cover__img { order: 1; position: relative; inset: auto; display: block; width: calc(100% - 2 * var(--gutter)); height: auto !important; aspect-ratio: 4 / 3; margin: 18px var(--gutter) 0; border-radius: 14px; box-shadow: 0 1px 0 var(--rule), 0 18px 40px -24px color-mix(in srgb, var(--ink-1) 40%, transparent); }
  :root:not([data-theme="dark"]) .cover:not(.cover--text) .cover__shade { display: none; }
  :root:not([data-theme="dark"]) .cover:not(.cover--text) .cover__foot { order: 2; margin-top: 0; padding: 16px var(--gutter) 22px; }
  :root:not([data-theme="dark"]) .cover:not(.cover--text) .mast__name, :root:not([data-theme="dark"]) .cover:not(.cover--text) .cover__story .disp, :root:not([data-theme="dark"]) .cover:not(.cover--text) .cl__t { color: var(--ink-1); text-shadow: none; }
  :root:not([data-theme="dark"]) .cover:not(.cover--text) .mast__date, :root:not([data-theme="dark"]) .cover:not(.cover--text) .cover__story .meta { color: var(--ink-2); text-shadow: none; }
  :root:not([data-theme="dark"]) .cover:not(.cover--text) .cover__story .disp { font-size: 36px; }

.idx a { border-bottom-color: color-mix(in srgb, var(--hue, var(--ink-3)) 30%, var(--rule)); }

a.desk, a.lead, a.thr, a.mapbox, a.l3, a.ask__c, a.fp-lead, a.tile, a.trow, a.rrow, a.shelf__i, a.pg, a.mosaic__c { display: block; }
