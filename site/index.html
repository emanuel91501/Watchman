.tickline__fill { display: block; height: 100%; background: var(--hue, var(--accent)); transform-origin: 0 50%; }
.tickline .newest { margin-top: 7px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.newest__k { font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--hue, var(--accent)); }
.tickline__age { color: var(--ink-1); }
/* hour rule: the signature move */
.hrule { display: grid; grid-template-columns: auto auto minmax(16px, 1fr) auto; align-items: end; column-gap: 8px; padding: 30px var(--gutter) 12px; }
.hrule__h { font-family: var(--f-head); font-size: 44px; line-height: .86; letter-spacing: -.01em; color: var(--ink-1); white-space: nowrap; }
.hrule__z { font-size: 12px; font-weight: 600; letter-spacing: .12em; color: var(--ink-2); padding-bottom: 3px; }
.hrule__line { height: 1px; background: var(--rule-strong); margin-bottom: 8px; }
.hrule__d { font-size: 12px; line-height: 1.3; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; min-width: 92px; }
.hrule__ago { color: var(--ink-1); font-weight: 500; }
.hrule--sm { padding: 6px 0 10px; }
.hrule--sm .hrule__h { font-size: 28px; }
/* Latest rail */
.latest { margin-top: 26px; }
.latest__head { margin: 0 var(--gutter) 12px; padding-top: 10px; border-top: 1px solid var(--rule-strong); }
.latest__head .tickline { margin: 8px 0 0; }
.latest__t { font-family: var(--f-head); font-size: 28px; line-height: 1; }
.latest__rail { display: grid; grid-auto-flow: column; grid-auto-columns: 62%; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 var(--gutter) 6px; scroll-padding: 0 var(--gutter); scrollbar-width: none; }
.latest__rail::-webkit-scrollbar { display: none; }
.lt { display: flex; flex-direction: column; min-width: 0; scroll-snap-align: start; }
.lt__img { display: block; width: 100%; height: auto; aspect-ratio: 3/2; object-fit: cover; border-radius: 12px; border-bottom: 4px solid var(--hue); background: var(--surface-2); }
.lt__age { font-family: var(--f-head); font-size: 26px; line-height: 1; color: var(--hue); margin: 10px 0 4px; }
.lt__t { font-family: var(--f-read); font-weight: 500; font-size: 17px; line-height: 1.26; margin-bottom: 6px; }
.lt .meta { font-size: 12px; }
/* the wire */
.wire { margin-top: 34px; border-top: 6px solid var(--ink-1); }
.wire__head { padding: 18px var(--gutter) 12px; }
.wire__t { font-family: var(--f-head); font-size: 44px; line-height: .98; margin: 6px 0 8px; }
.wire .stamp { border-top: 1px solid var(--rule); }
.wire__hour { border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.wl { display: block; margin: 0 0 4px; }
.wl__img { display: block; width: 100%; height: auto; aspect-ratio: 16/10; object-fit: cover; border-top: 4px solid var(--hue); background: var(--surface-1); }
.wl .credit { padding: 6px var(--gutter) 0; }
.wl__txt { padding: 10px var(--gutter) 14px; }
.wl__t { font-family: var(--f-head); font-size: 28px; line-height: 1.05; margin: 6px 0 8px; }
.wl .dek { font-size: 16px; }
.wl .meta { margin-top: 8px; }
.wr { display: grid; grid-template-columns: 54px minmax(0, 1fr) 84px; gap: 12px; align-items: start; padding: 14px var(--gutter); border-top: 1px solid var(--rule); }
.wr--text { grid-template-columns: 54px minmax(0, 1fr); }
.wr__time { font-family: var(--f-num); font-size: 24px; line-height: 1; color: var(--hue); font-variant-numeric: tabular-nums; border-top: 2px solid var(--hue); padding-top: 6px; }
.wr__time small { display: block; font-family: var(--f-ui); font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.wr__t { font-family: var(--f-read); font-weight: 500; font-size: 17px; line-height: 1.26; margin: 3px 0 6px; }
.wr .meta { font-size: 12px; }
.wr__img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; background: var(--surface-2); }
/* story timeline hour marks */
.unfold li.unfold__hr { padding: 0 0 4px 12px; }
.unfold li.unfold__hr::before { display: none; }
/* ---------- M4-C Ledger ---------- */
.jshelf { margin: 8px 0 28px; padding: 22px var(--gutter) 6px; border-top: 6px solid var(--washington); background: color-mix(in srgb, var(--washington) 7%, var(--bg)); }
.jshelf__t { font-family: var(--f-head); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 4px 0 8px; letter-spacing: -0.01em; }
.jshelf .dek { font-size: 15px; color: var(--ink-2); line-height: 1.45; margin: 0 0 14px; }
.jshelf__sub { margin: 22px 0 4px; }
.jhead { display: grid; grid-template-columns: 1fr 104px; gap: 12px; padding: 0 0 6px; border-bottom: 1px solid var(--rule-strong); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.jrow { display: grid; grid-template-columns: 1fr 104px; gap: 6px 12px; padding: 14px 0 12px; border-bottom: 1px solid var(--rule); color: inherit; text-decoration: none; }
.jrow__who { min-width: 0; }
.jrow__n { font-family: var(--f-head); font-weight: 400; font-size: 23px; line-height: 1.1; margin: 0 0 3px; }
.jrow__c { font-size: 14px; line-height: 1.35; color: var(--ink-1); margin: 0 0 3px; }
.jrow__s { align-self: start; border-left: 3px solid var(--st); padding: 2px 0 2px 8px; font-size: 14px; font-weight: 600; color: var(--st); line-height: 1.2; }
.jrow__s small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.jlad { grid-column: 1 / -1; list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--rule); }
.jlad li { padding: 7px 4px 0 0; border-top: 3px solid transparent; margin-top: -2px; min-width: 0; }
.jlad li.is-on { border-top-color: var(--washington); }
.jlad__w { display: block; font-size: 12px; font-weight: 600; color: var(--ink-1); }
.jlad li:not(.is-on) .jlad__w { color: var(--ink-3); font-weight: 500; }
.jlad__d { display: block; font-size: 12px; color: var(--ink-2); font-family: var(--f-ui); font-variant-numeric: tabular-nums; }
.jlad li:not(.is-on) .jlad__d { color: var(--ink-3); }
.jrow__src { grid-column: 1 / -1; margin: 2px 0 0; }
.tile__twin { font-size: 12px; line-height: 1.3; color: var(--money); border-left: 2px solid var(--money); padding-left: 6px; margin: 4px 0 4px; }
:root[data-theme="light"] .tile__twin { color: var(--ink-1); }
.tile__scale { font-size: 12px; color: var(--ink-3); margin: 2px 0 4px; font-variant-numeric: tabular-nums; }
.tile__vint { color: var(--ink-3); }
.note--chain { border-left-color: var(--washington); margin: 8px 0 4px; }

/* ---------- M4 merge ---------- */
.l3--text { grid-template-columns: minmax(0, 1fr); border-left: 3px solid var(--hue); padding-left: 12px; }
.l3--text > * { grid-column: 1 !important; }
.ledger__t { overflow: visible; display: block; }
/* bookcase: 7 spines a row, 44 px wide (tap target), full names in up to two vertical lines */
.case .books { height: 236px; gap: 6px; justify-content: space-between; }
.case .book { flex: 0 0 44px; width: 44px; min-height: 0; padding: 7px 0 8px; overflow: visible; }
.case .book__t { font-size: 13px; line-height: 1.12; white-space: normal; overflow: visible; margin: 6px 0 0; max-height: none; text-align: start; overflow-wrap: normal; }
/* M4 first screen: a shorter 16:10 lead, then the Latest rail of pictured cards lands inside the first screen */
.fp-photo__img { aspect-ratio: 16/10; }
.latest { margin-top: 14px; }
.latest__head { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: end; column-gap: 14px; margin-bottom: 10px; padding-top: 8px; }
.latest__head .tickline { margin: 0; }
.latest__head .tickline .newest { margin-top: 4px; }
.latest__head .newest__k { display: none; }
.latest__t { font-size: 30px; }
.latest__rail { grid-auto-columns: 41%; gap: 10px; }
.lt__img { aspect-ratio: 1/1; border-radius: 10px; }
.lt__age { font-size: 22px; margin: 8px 0 3px; }
.lt__t { font-size: 15px; line-height: 1.25; }
.latest__head { border-top: 0; padding-top: 0; }
.lt__age { margin: 0 0 6px; font-size: 20px; }
.lt__img + .lt__t { margin-top: 8px; }
/* desk ribbon under the masthead */
.desks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0 var(--gutter); border-bottom: 1px solid var(--rule-strong); }
.desk-r { display: flex; flex-direction: column; gap: 2px; padding: 8px 6px 8px 0; min-height: 44px; color: inherit; text-decoration: none; border-top: 3px solid var(--hue); margin-right: 6px; }
.desk-r:last-child { margin-right: 0; }
.desk-r .kick { color: var(--hue); font-size: 12px; letter-spacing: .06em; white-space: nowrap; }
.desk-r__a { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.desks + .fp-lead { margin-top: 0; }

/* ===== M5-C FRONT PAGE ===== */
.h-world { --mast: var(--mast-world); } .h-us { --mast: var(--mast-us); } .h-indiana { --mast: var(--mast-indiana); } .h-washington { --mast: var(--mast-washington); } .h-money { --mast: var(--mast-money); --hue: var(--money); }
a.cover { display: block; margin: 0; }
.cv-photo { position: relative; height: 60vh; min-height: 420px; max-height: 560px; overflow: hidden; background: var(--cv-black); }
.cv-photo__img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; }
.cv-shade { position: absolute; inset: 0 0 auto 0; height: 190px; background: linear-gradient(to bottom, var(--cover-shade), var(--cover-shade-0)); pointer-events: none; }
.cv-photo > .credit { position: absolute; right: 8px; bottom: 8px; margin: 0; padding: 3px 8px; border-radius: 8px; background: var(--credit-bg); color: var(--credit-ink); font-size: 12px; line-height: 1.3; max-width: 70%; white-space: normal; }
.cv-mast { position: absolute; left: 0; right: 0; top: 0; padding: 14px var(--gutter) 0; text-align: left; color: var(--cv-white); }
.cv-mast__row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--cv-ink-2); padding-bottom: 8px; border-bottom: 1px solid var(--cv-rule); }
.cv-mast .fp-mast__clock { color: var(--cv-white); }
.cv-mast__name { font-family: var(--f-head); font-size: 76px; line-height: .86; letter-spacing: -.025em; margin: 10px 0 2px; color: var(--mast); text-shadow: 0 1px 18px var(--cv-glow); }
.cv-mast__sub { font-family: var(--f-read); font-style: italic; font-size: 15px; color: var(--cv-ink-2); }
.cv-block { border-top: 0; }
.cover .fp-lead__t { font-size: 36px; }

.bm { margin: 22px var(--gutter) 0; padding: 18px 16px 14px; border-radius: 20px; background: var(--card); border: 1px solid var(--rule); }
.bm__head { display: flex; flex-direction: column; gap: 2px; padding-bottom: 10px; border-bottom: 3px double var(--ink-1); }
.bm__t { font-family: var(--f-head); font-size: 34px; line-height: 1; color: var(--ink-1); }
.bm__s { list-style: none; margin: 12px 0 0; padding: 0; counter-reset: none; }
.bm__li { font-family: var(--f-read); font-size: 17px; line-height: 1.5; color: var(--ink-1); padding: 10px 0 10px 12px; border-left: 3px solid var(--hue); margin-bottom: 6px; }
.bm__li b { font-family: var(--f-ui); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--hue); }
.bm__n { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; font-family: var(--f-ui); font-size: 12px; font-weight: 700; background: var(--hue); color: var(--on-hue); vertical-align: 2px; }
.bm__src { list-style: none; margin: 10px 0 0; padding: 10px 0 0; border-top: 1px solid var(--rule-strong); }
.bm__src a { display: grid; grid-template-columns: 26px 1fr; gap: 6px; padding: 5px 0; font-size: 13px; line-height: 1.4; color: var(--ink-2); }
.bm__k { font-weight: 700; color: var(--ink-1); }

.dk { margin: 28px var(--gutter) 0; }
.dk__head { padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--rule-strong); }
.dk__t { font-family: var(--f-head); font-size: 34px; line-height: 1; color: var(--ink-1); }
.dk__g { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
a.dk__c { display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; background: var(--card); border: 1px solid var(--rule); min-width: 0; }
.dk__ph { position: relative; aspect-ratio: 1 / 1; background: var(--surface-2); border-bottom: 5px solid var(--hue); }
.dk__img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.dk__ph--seal { background: color-mix(in srgb, var(--hue) 22%, var(--card)); }
.dk__ph--seal .dk__img { object-fit: cover; object-position: 50% 20%; }
.dk__b { padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.dk__k { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--hue); }
.dk__k span { letter-spacing: .02em; text-transform: none; font-weight: 600; }
.dk__tt { font-family: var(--f-head); font-size: 20px; line-height: 1.08; color: var(--ink-1); overflow-wrap: anywhere; hyphens: auto; }
.dk__b .meta { margin-top: auto; }

.tk { margin: 28px 0 0; padding: 14px 0 16px; background: color-mix(in srgb, var(--money) var(--block-mix), var(--bg)); border-top: 3px solid var(--money); border-bottom: 1px solid var(--rule); }
.tk__head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 var(--gutter) 10px; }
.tk__head .kick { color: var(--money); }
.tk__all { font-size: 13px; font-weight: 600; color: var(--ink-1); }
.tk__rail { display: flex; gap: 0; overflow-x: auto; scroll-snap-type: x proximity; padding: 0 var(--gutter); scrollbar-width: none; }
.tk__rail::-webkit-scrollbar { display: none; }
a.tk__i { flex: 0 0 auto; display: flex; flex-direction: column; gap: 2px; padding: 2px 16px 2px 0; margin-right: 16px; border-right: 1px solid var(--rule-strong); scroll-snap-align: start; white-space: nowrap; }
.tk__n { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.tk__v { font-family: var(--f-num); font-size: 30px; line-height: 1.05; color: var(--ink-1); font-variant-numeric: tabular-nums; }
.tk__s { font-size: 12px; color: var(--ink-3); }

.wire__more { margin: 8px 0 0; }
.wire__more > summary { list-style: none; cursor: pointer; margin: 0 var(--gutter); padding: 14px 0; border-top: 3px double var(--ink-1); border-bottom: 1px solid var(--rule); font-size: 14px; font-weight: 600; color: var(--ink-1); }
.wire__more > summary::-webkit-details-marker { display: none; }
.cv-photo { height: 60vh; min-height: 470px; }
.cv-shade--b { inset: auto 0 0 0; height: 70%; background: linear-gradient(to top, var(--cover-shade), var(--cover-shade) 30%, var(--cover-shade-0)); }
.cv-text { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 var(--gutter) 14px; color: var(--cv-white); }
.cv-kick { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--mast); }
.cover .cv-t { color: var(--cv-white); font-size: 34px; line-height: 1.02; margin: 6px 0 8px; }
.cv-meta { font-size: 13px; line-height: 1.5; color: var(--cv-ink-3); }
.cv-meta b { color: var(--cv-white); font-weight: 600; } .cv-meta .truth { color: var(--cv-white); border-color: currentColor; } .cv-meta .ago { color: var(--mast); }
.cv-text > .credit { position: static; display: inline-block; margin-top: 6px; padding: 0; background: none; color: var(--cv-ink-4); font-size: 12px; }
.cvl { display: flex; flex-direction: column; margin: 0 var(--gutter); }
a.cvl__i { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.cvl__img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--surface-2); box-shadow: inset 0 -4px 0 var(--hue); }
.cvl__b { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cvl__k { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--hue); }
.cvl__t { font-family: var(--f-head); font-size: 19px; line-height: 1.1; color: var(--ink-1); }
.wire__btn { display: block; width: calc(100% - 2 * var(--gutter)); margin: 8px var(--gutter) 0; padding: 14px 0; text-align: left; background: none; border: 0; border-top: 3px double var(--ink-1); border-bottom: 1px solid var(--rule); font: 600 14px/1.4 var(--f-ui); color: var(--ink-1); cursor: pointer; }
/* ---------- M5-A SWORN: the evidence line under every status word ---------- */
.oath { font-family: var(--f-ui); font-size: 12px; line-height: 1.4; color: var(--ink-2); margin: 6px 0 0; padding-left: 8px; border-left: 2px solid var(--st, var(--rule-strong)); overflow-wrap: anywhere; }
.oath__k, .oath q { display: block; }
.oath q { quotes: "\201C" "\201D"; color: var(--ink-1); }
.oath__k { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--st, var(--ink-2)); }
.oath__d { color: var(--ink-2); white-space: nowrap; }
.rrow__oath { grid-column: 2 / -1; margin-top: 0; }
.ledger__oath { grid-column: 1 / -1; margin: 2px 0 0; }
.ledger__r { grid-template-columns: 56px minmax(0, 1fr) 96px; }
.ledger__s { letter-spacing: .03em; overflow-wrap: normal; }
.jrow__oath { grid-column: 1 / -1; }
.ruled__oath { display: block; grid-column: 2 / -1; margin-top: 2px; }
.ruled__d[data-word] { color: var(--st, var(--hue)); }
.ruled__d small { display: block; font-size: 12px; font-weight: 400; color: var(--ink-2); text-transform: none; letter-spacing: 0; }
.jsum { width: 100%; border-collapse: collapse; margin: 14px 0 6px; font-family: var(--f-ui); font-size: 14px; }
.jsum th { text-align: left; font-weight: 500; color: var(--ink-1); padding: 8px 0; border-bottom: 1px solid var(--rule); }
.jsum td { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--st, var(--ink-1)); padding: 8px 0 8px 12px; border-bottom: 1px solid var(--rule); border-left: 3px solid var(--st, transparent); }
.jsum__t th, .jsum__t td { border-bottom: 0; border-top: 2px solid var(--ink-1); font-weight: 700; }
.jgrp { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; margin: 22px 0 4px; padding-bottom: 8px; border-bottom: 2px solid var(--ink-1); }
.jgrp__n { font-family: var(--f-num); font-size: 40px; line-height: 1; color: var(--ink-1); }
.jgrp__w { font-family: var(--f-ui); font-size: 15px; font-weight: 700; color: var(--ink-1); margin: 0; }
.jgrp .meta { margin: 2px 0 0; }
.stories__rule { margin: 10px 0 0; font-size: 14px; }

/* ===== M5 build "Front Page, Sworn" ===== */
/* the cover is the C cover in BOTH themes: the old M1 .cover min-height (844 px) no longer applies, so cover lines sit under the photo */
a.cover, :root[data-theme="light"] a.cover { min-height: 0; padding-top: 0; background: transparent; color: var(--cv-white); display: block; }
/* wire rows without a photo carry a 4 px rule in their desk hue (no boxed tiles) */
.wr--rule { grid-template-columns: 54px minmax(0, 1fr); box-shadow: inset 4px 0 0 var(--hue); }
.wr__t { overflow-wrap: anywhere; }
/* the Earlier today fold */
.wire__earlier > summary { display: block; }
.wire__fold-t { font-family: var(--f-head); font-size: 20px; font-weight: 400; }
.wire__fold-m { font-weight: 500; color: var(--ink-2); }
/* ticker: every numeral sits 16 px inside the frame, start and end */
.tk__rail { padding: 0 16px; scroll-padding-inline: 16px; }
.tk__rail::after { content: ''; flex: 0 0 1px; }
a.tk__i { padding-left: 2px; }
a.tk__i:last-child { border-right: 0; margin-right: 0; }
/* no-photo cover (fixtures, or a lead without a stored picture): a plain paper block, never an empty shaded box */
.cv-photo--none { height: auto; min-height: 0; max-height: none; background: var(--surface-1); }
.cv-photo--none .cv-mast, .cv-plain .cv-mast { position: relative; color: var(--ink-1); }
.cv-photo--none .cv-mast__row, .cv-plain .cv-mast__row, .cv-photo--none .cv-mast__sub, .cv-plain .cv-mast__sub, .cv-photo--none .fp-mast__clock, .cv-plain .fp-mast__clock { color: var(--ink-2); border-color: var(--rule); }
.cv-photo--none .cv-mast__name, .cv-plain .cv-mast__name { text-shadow: none; }
.cv-photo--none .cv-text { position: relative; color: var(--ink-1); padding-top: 18px; }
.cv-photo--none .cv-t, .cv-photo--none .cv-meta { color: var(--ink-1); }
/* citation numbers: a 44 px tap target around the 22 px badge */
a.bm__n { min-width: 44px; height: 44px; margin: -11px -6px; padding: 0; background: none; vertical-align: middle; }
.bm__b { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--hue); color: var(--on-hue); font-size: 12px; font-weight: 700; }

.bm__src a { min-height: 44px; align-items: center; }
.tk__all { display: inline-flex; align-items: center; min-height: 44px; }

/* M6-B Desk Editor */
.why { font-family: var(--f-ui, inherit); font-size: 12px; line-height: 1.35; color: var(--ink-2); margin: 6px 0 0; padding-top: 6px; border-top: 1px solid var(--rule); letter-spacing: .01em; }
.jlad-none { grid-column: 1 / -1; color: var(--ink-3); margin: 6px 0 0; }
.wfold { margin: 0 16px 18px; border-top: 1px solid var(--rule); }
.wfold > summary { min-height: 44px; display: flex; align-items: center; font-weight: 600; color: var(--washington); cursor: pointer; list-style: none; font-size: 15px; }
.wfold > summary::-webkit-details-marker { display: none; }
.wfold > summary::after { content: '+'; margin-left: auto; font-size: 20px; }
.wfold[open] > summary::after { content: '−'; }
.dk__tt { -webkit-mask-image: none !important; mask-image: none !important; display: block; -webkit-line-clamp: unset; overflow: visible; }
/* ---- M6-C SECOND EDITION ---------------------------------------------------------------------------------------- */
/* Money: the sparkline stays under the masthead rule; its end dot is not stretched */
.m4__bleed { top: 64px; height: calc(100% - 64px); }
.m4__bleed .spark circle { display: none; }
/* the wire's dated gap note */
.gapnote { margin: 4px var(--gutter) 14px; padding: 10px 0 10px 14px; border-left: 2px dashed var(--rule-strong); font-size: 13px; color: var(--ink-2); }
.gapnote__k { font-weight: 600; color: var(--ink-1); }
/* end tables: the As of column */
.etable--asof thead th { font-size: 12px; padding-top: 4px; padding-bottom: 6px; border-top: 0; color: var(--ink-3); width: auto; }
.etable--asof th[scope=row] { width: 30%; }
.etable--asof .etable__as { width: 64px; min-width: 64px; padding-left: 10px; font-size: 12px; line-height: 1.35; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.etable--asof td.etable__as { border-top: 1px solid var(--rule); vertical-align: top; padding-top: 10px; }
.etable--asof tfoot td { padding: 10px 0 2px; font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--rule); }

.cv-ed { margin-top: 10px; max-width: 330px; }
.cv-ed__t { font-family: var(--f-ui); font-size: 13px; line-height: 1.35; color: var(--on-photo-2); font-variant-numeric: tabular-nums; }
.cv-ed__t b { color: var(--on-photo); font-weight: 600; }
.cv-ed__strip { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; align-items: end; height: 18px; margin-top: 8px; border-bottom: 1px solid color-mix(in srgb, var(--on-photo) 45%, transparent); }
.cv-ed__strip i { display: block; height: calc(18px * var(--f)); background: var(--hue, var(--on-photo)); border-radius: 1px 1px 0 0; }
.cv-plain .cv-ed__t { color: var(--ink-2); } .cv-plain .cv-ed__t b { color: var(--ink-1); }

/* ===== M6-A READING ROOM: Stories as a pictured spine of dossiers; the story page opens on a full-bleed cover ===== */
.rr-mast { padding: 18px var(--gutter) 14px; border-bottom: 1px solid var(--rule); }
.rr-mast__k { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--library); }
.rr-mast__t { font-family: var(--f-head); font-weight: 400; font-size: 64px; line-height: .95; letter-spacing: -.01em; margin: 4px 0 6px; color: var(--ink-1); }
.rr-mast__d { font-size: 13px; line-height: 1.4; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rr-cover { display: block; position: relative; margin: 12px 10px 0; border-radius: 22px; overflow: hidden; background: var(--surface-1); color: var(--on-photo); }
.rr-cover__ph { position: relative; height: 470px; }
.rr-cover__img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.rr-cover__txt { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 18px 18px; }
.rr-cover__k { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--mast-world); }
.rr-cover__t { font-size: 38px; line-height: 1.02; color: var(--on-photo); margin: 6px 0 8px; }
.rr-cover .dz__n { color: var(--on-photo-2); }
.rr-cover .oath { color: var(--on-photo-2); border-left-color: var(--mast-indiana); }
.rr-credit { padding: 6px 20px 0; font-size: 12px; color: var(--ink-2); }
.rr-rule { margin: 14px var(--gutter) 0; font-size: 13px; line-height: 1.45; color: var(--ink-2); }
.rr-rule b { color: var(--ink-1); font-weight: 600; }
.rr-day { margin: 22px 10px 0; }
.rr-day__rule { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 0 6px 8px; border-bottom: 4px solid var(--hue); }
.rr-day__d { font-family: var(--f-head); font-size: 30px; line-height: 1; color: var(--hue); }
.rr-day__n { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.dz { display: block; margin-top: 10px; border-radius: 16px; overflow: hidden; background: color-mix(in srgb, var(--hue) var(--block-mix), var(--card)); }
.dz__ph { margin: 0; }
.dz__img { display: block; width: 100%; height: auto; aspect-ratio: 16/9; object-fit: cover; background: var(--surface-2); border-bottom: 4px solid var(--hue); }
.dz__body { display: grid; grid-template-columns: 76px minmax(0, 1fr); column-gap: 12px; padding: 14px 14px 14px 12px; }
.dz__st { display: flex; flex-direction: column; gap: 3px; padding-right: 10px; border-right: 1px solid color-mix(in srgb, var(--st) 50%, var(--rule)); }
.dz__w { font-size: 13px; font-weight: 700; color: var(--st); letter-spacing: .02em; }
.dz__w::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--st); margin-right: 5px; vertical-align: 1px; }
.dz__d, .dz__f { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.dz__f { color: var(--hue); font-weight: 600; }
.dz__t { font-family: var(--f-read); font-weight: 500; font-size: 19px; line-height: 1.25; color: var(--ink-1); }
.dz--ph .dz__t { font-family: var(--f-head); font-weight: 400; font-size: 26px; line-height: 1.05; }
.dz__n { font-size: 13px; color: var(--ink-2); margin-top: 6px; font-variant-numeric: tabular-nums; }
.dz__n b { color: var(--ink-1); font-weight: 600; }
.rr-cover .dz__n b { color: var(--on-photo); }
.s-cover { position: relative; margin: 10px 10px 0; border-radius: 22px; overflow: hidden; height: 540px; background: var(--surface-1); }
.s-cover__img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.s-cover__txt { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 18px 20px; }
.s-cover__k { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--on-photo-2); }
.s-cover__t { font-size: 38px; line-height: 1.02; color: var(--on-photo); margin-top: 6px; }
.s-head--under { padding-top: 12px; }
.s-state { margin: 4px 0 10px; padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.45; color: var(--ink-2); background: color-mix(in srgb, var(--st) 12%, var(--card)); border-left: 4px solid var(--st); }
.s-state b { color: var(--st); font-weight: 700; margin-right: 2px; }
.ladder__h { font-size: 30px; }
.ladder__ol { list-style: none; margin: 16px 0 0 !important; padding: 0; border-left: 0 !important; }
.ladder__i { display: grid; grid-template-columns: 70px minmax(0, 1fr); column-gap: 14px; padding: 0 !important; }
.ladder__i::before { display: none; }
.ladder__d { display: flex; flex-direction: column; gap: 2px; padding: 12px 0; text-transform: none !important; letter-spacing: 0 !important; }
.ladder__d b { font-size: 13px; font-weight: 700; color: var(--hue); }
.ladder__d span { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ladder__b { position: relative; padding: 12px 0 12px 16px; border-left: 2px solid color-mix(in srgb, var(--hue) 55%, var(--rule)); }
.ladder__b::before { content: ""; position: absolute; left: -6px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--card); border: 2px solid var(--hue); box-sizing: border-box; }
.ladder__i.is-last .ladder__b::before { background: var(--hue); }
.rel3__g { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 10px 10px; }
.rel3__c { display: flex; flex-direction: column; min-width: 0; border-radius: 14px; overflow: hidden; background: var(--card); }
.rel3__c--big { grid-column: 1 / -1; }
.rel3__img { width: 100%; height: auto; aspect-ratio: 4/3; object-fit: cover; background: var(--surface-2); border-bottom: 3px solid var(--hue); }
.rel3__c--big .rel3__img { aspect-ratio: 16/9; }
.rel3__t { padding: 10px 12px 12px; }
.rel3__t h4 { font-family: var(--f-read); font-weight: 500; font-size: 16px; line-height: 1.25; margin: 4px 0 6px; color: var(--ink-1); }
.rel3__c--big .rel3__t h4 { font-family: var(--f-head); font-weight: 400; font-size: 24px; line-height: 1.05; }
.rel3__t .meta { font-size: 12px; }

/* ===== M6 "Reading Room, Edited": Today's desks as dossiers; Stories fold; repeated-headline line ===== */
.dk--dz { margin-left: 10px; margin-right: 10px; }
.dk--dz .dk__head { margin-left: 6px; margin-right: 6px; }
.dz--dk { color: inherit; }
.dz--dk .dz__img { aspect-ratio: 3 / 2; }
.dz--seal .dz__img { object-position: 50% 18%; }
.dz__desk { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--hue); margin-bottom: 4px; }
.dz__desk .ago { letter-spacing: .02em; text-transform: none; font-weight: 600; color: var(--ink-2); }
.dz__oath { margin-top: 6px; font-size: 12px; }
.dz__fold { margin-top: 6px; font-size: 12px; color: var(--ink-2); }
.rr-fold { margin: 22px 10px 0; }
.rr-fold .dz { margin-top: 8px; }
/* M6: Today's masthead on the page, the lead as an inset reading-room cover */
.cv-mast--page { position: relative; padding: 14px var(--gutter) 12px; color: var(--ink-1); border-bottom: 1px solid var(--rule); }
.cv-mast--page .cv-mast__row { color: var(--ink-2); border-color: var(--rule); }
.cv-mast--page .fp-mast__clock { color: var(--ink-1); }
.cv-mast--page .cv-mast__name { text-shadow: none; font-size: 64px; }
.cv-mast--page .cv-ed { max-width: none; }
.cv-mast--page .cv-ed__t { color: var(--ink-2); } .cv-mast--page .cv-ed__t b { color: var(--ink-1); }
.cv-mast--page .cv-ed__strip { border-bottom-color: var(--rule-strong); }
.cv-mast--page .cv-ed__strip i { background: var(--mast); }
a.cover.cover--rr { margin: 12px 10px 0; border-radius: 22px; overflow: hidden; }
.cover--rr .cv-photo { height: 470px; min-height: 0; max-height: none; }
.cover--rr .cv-photo--none { height: auto; }
.rr-mast--room .rr-mast__k { color: var(--hue); }
.rr-mast--room { border-bottom: 4px solid var(--hue); margin-bottom: 4px; }
/* M6 Money: the sparkline sits in the lower part of the header, under the rule and the kicker, at reading strength */
.m4__bleed { top: auto; bottom: 0; height: 58%; opacity: .42; }
.m4__bleed.m4__band { position: relative; top: auto; bottom: auto; left: auto; right: auto; height: 104px; opacity: 1; margin: 16px var(--gutter) 0; border-top: 1px solid var(--rule); padding-top: 8px; }
.m4__band .spark path { stroke-width: 2; }

/* apple.css — Nov 1 12:29, his words: "fit my phone", "recreate Apple … at least better", "pull the foundational things
   from Apple". This layer is LAST in the cascade and resets the foundation to Apple's own system:
   SF Pro / New York (the iPhone's system faces), Apple's semantic colours (one red accent, grey secondary text,
   no rainbow), Apple's Dynamic Type scale (34 / 28 / 22 / 20 / 17 / 15 / 13), 16 px margins, nothing wider than the screen. */

/* ---------- colour: Apple semantic system colours (iOS dark / light) ---------- */
:root, :root[data-theme="dark"] {
  --bg: #000000; --surface-1: #1c1c1e; --surface-2: #2c2c2e; --surface-3: #3a3a3c; --card: #1c1c1e;
  --rule: rgba(84, 84, 88, .55); --rule-strong: #636366;
  --ink-1: #ffffff; --ink-2: #98989f; --ink-3: #8d8d93;
  --accent: #ff453a; --accent-ink: #ffffff; --stale: #ffd60a; --bad: #ff453a;
  --glass: rgba(30, 30, 32, .72); --glass-line: rgba(255, 255, 255, .12); --scrim: rgba(0, 0, 0, .45);
  --tint: #ff453a; --fill: rgba(120, 120, 128, .24); --fill-2: rgba(120, 120, 128, .16);
}
:root[data-theme="light"] {
  --bg: #ffffff; --surface-1: #f2f2f7; --surface-2: #e5e5ea; --surface-3: #d1d1d6; --card: #f2f2f7;
  --rule: rgba(60, 60, 67, .2); --rule-strong: #8e8e93;
  --ink-1: #000000; --ink-2: #6c6c70; --ink-3: #6c6c70;
  --accent: #e0291e; --accent-ink: #ffffff; --stale: #946800; --bad: #d70015;
  --glass: rgba(249, 249, 249, .78); --glass-line: rgba(0, 0, 0, .08); --scrim: rgba(0, 0, 0, .2);
  --tint: #e0291e; --fill: rgba(120, 120, 128, .16); --fill-2: rgba(120, 120, 128, .1);
}
/* the desks no longer each own a colour: one accent, like Apple News. Every former desk hue reads as the secondary grey. */
:root, :root[data-theme="dark"], :root[data-theme="light"] {
  --world: var(--ink-2); --us: var(--ink-2); --indiana: var(--ink-2); --washington: var(--ink-2); --money: var(--ink-2);
  --library: var(--ink-2); --elsewhere: var(--ink-2); --block-mix: 0%;
  --mast-world: var(--ink-1); --mast-us: var(--ink-1); --mast-indiana: var(--ink-1); --mast-washington: var(--ink-1); --mast-money: var(--ink-1);
  --st-presented: var(--ink-2); --st-signed: #30d158; --st-published: var(--ink-2); --spine: var(--rule);
  --on-hue: var(--ink-1); --on-hue-2: var(--ink-2);
  --f-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  --f-head: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  --f-num: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Helvetica Neue", Roboto, sans-serif;
  --f-read: ui-serif, "New York", "Iowan Old Style", Charter, Georgia, serif;
  --gutter: 16px; --r-card: 12px; --r-sheet: 14px;
  --pad-bottom: calc(96px + env(safe-area-inset-bottom));
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #ffffff; } }

/* ---------- the page never exceeds the screen ---------- */
html, body { max-width: 100%; overflow-x: clip; }
body { font-family: var(--f-ui); font-size: 17px; line-height: 1.29; letter-spacing: -.01em; background: var(--bg); color: var(--ink-1); }
.wm-body { overflow-x: clip; }
img, svg, video, canvas, table { max-width: 100%; }
* { text-transform: none !important; }
.wm-body, .wm-body * { min-width: 0; }

/* scroll rails stay inside the screen; their items scroll within them */
.tk__rail, .reel, .day4__rail, .ask__rail, .latest__rail { max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; contain: paint; }

/* fixed heights that assumed an 844 px window become proportions */
.cover { min-height: 0 !important; }
.hero { height: auto !important; aspect-ratio: 4 / 3; }
.s-cover { height: auto !important; aspect-ratio: 4 / 5; max-height: 72vh; }
.cv-photo { height: auto !important; min-height: 0 !important; max-height: none !important; aspect-ratio: 3 / 2; }
.cv-photo--none { aspect-ratio: auto; }

/* ---------- type: Apple Dynamic Type ---------- */
/* Large Title 34 */
.cv-mast__name, .fp-mast__name, .mast__name, .front .opener__t {
  font-family: var(--f-head) !important; font-weight: 700 !important; font-size: 34px !important; line-height: 41px !important;
  letter-spacing: .011em !important; color: var(--ink-1) !important; text-shadow: none !important; margin: 2px 0 4px !important; }
/* Title 2 — section headers */
.bm__t, .dk__t, .wire__t, .ask__t, .opener__t, .ch .opener__t, .sec .opener__t, .branch__t, .leads__t, .desk__t, .jshelf__t,
.idx__h, .gsheet__t, .front3__t, .front4__t, .latest__t, .answer__head .disp, .s-head .disp {
  font-family: var(--f-head) !important; font-weight: 700 !important; font-size: 22px !important; line-height: 28px !important;
  letter-spacing: .015em !important; color: var(--ink-1) !important; }
/* Title 1 — the lead headline */
.cv-t, .fp-lead__t, .cover .fp-lead__t, .cover .cv-t, .hero__t .disp, .cover__story .disp, .pg--home .pg__t {
  font-family: var(--f-head) !important; font-weight: 700 !important; font-size: 26px !important; line-height: 31px !important;
  letter-spacing: .01em !important; }
/* Headline 17 semibold — every card / row headline */
.dz__t, .cvl__t, .wl__t, .wr__t, .l3__t, .lead__t, .dk__tt, .rrow__t, .tile__l, .desk__t + p, .g4__c h3, .mosaic__c h3,
.rel3__c h3, .d4 h3, .wire h3, .wire h4, .pg__t, .ledger__t {
  font-family: var(--f-head) !important; font-weight: 600 !important; font-size: 17px !important; line-height: 22px !important;
  letter-spacing: -.02em !important; }
/* large figures: Title 1 bold, tabular */
.tile__v, .tk__v, .ballot__count, .m4__n small, .m-big small, .d4__mark {
  font-family: var(--f-num) !important; font-weight: 700 !important; font-size: 28px !important; line-height: 34px !important;
  letter-spacing: 0 !important; font-variant-numeric: tabular-nums; }
.hrule__h { font-family: var(--f-head) !important; font-weight: 700 !important; font-size: 20px !important; line-height: 25px !important; letter-spacing: 0 !important; }
/* reading text: New York 18 */
.body, .bm__s, .dek, .opener__d, .desk p { font-family: var(--f-read); }
.body { font-size: 18px !important; line-height: 1.5 !important; }
.body .lede::first-letter { font-family: inherit !important; float: none !important; font-size: inherit !important; line-height: inherit !important; padding: 0 !important; }
.dek, .opener__d { font-size: 15px !important; line-height: 20px !important; color: var(--ink-2) !important; }
/* Footnote 13 — kickers and meta lines, grey, sentence case */
.kick, .cv-kick, .cvl__k, .dz__desk, .wm-sheet__k, .tk__head .kick, .lines3__k, .cv-mast__row, .fp-mast__row {
  font-family: var(--f-ui) !important; font-size: 13px !important; line-height: 18px !important; font-weight: 600 !important;
  letter-spacing: -.005em !important; color: var(--ink-2) !important; }
.meta, .cv-meta, .cv-ed, .stamp, .oath, .dz__n, .tk__s, .tk__n, .rrow__d, .credit, .ago, .wr__time {
  font-family: var(--f-ui) !important; font-size: 13px !important; line-height: 18px !important; letter-spacing: -.005em !important; }
.meta, .cv-meta, .cv-ed, .stamp, .oath, .dz__n, .tk__s, .rrow__d, .wr__time { color: var(--ink-2) !important; }
.meta b, .cv-meta b, .dz__n b { color: var(--ink-1); font-weight: 600; }
.cv-kick { color: var(--accent) !important; }
.ago { color: var(--ink-2) !important; }

/* ---------- the Today masthead: Apple's large-title header ---------- */
.cv-mast { padding: 12px var(--gutter) 6px !important; background: transparent !important; }
.cv-mast__row { display: flex !important; justify-content: space-between; align-items: baseline; margin: 0 !important; }
.fp-mast__clock, .cv-mast__row > span:last-child { color: var(--ink-2) !important; font-weight: 600; }
.fp-live { background: var(--accent) !important; }
.cv-ed { margin: 0 0 8px !important; }
.cv-ed b { color: var(--ink-1) !important; font-weight: 600 !important; }
.cv-ed svg rect, .cv-ed i, .cv-ed span[class*="bar"] { fill: var(--surface-3) !important; background: var(--surface-3) !important; }

/* ---------- the lead: Apple News hero card (photo on top, headline under) ---------- */
a.cover.cover--rr { margin: 8px var(--gutter) 0 !important; border-radius: 12px !important; background: var(--card) !important; color: var(--ink-1) !important; border: 0 !important; }
.cover--rr .cv-photo { border-radius: 0; }
.cover--rr .cv-shade { display: none !important; }
.cover--rr .cv-photo:not(.cv-photo--none) { display: flex; flex-direction: column; aspect-ratio: auto; }
.cover--rr .cv-photo:not(.cv-photo--none) > .cv-photo__img { position: relative !important; inset: auto !important; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; height: auto !important; }
.cover--rr .cv-text { position: relative !important; inset: auto !important; padding: 12px 16px 16px !important; background: transparent !important; color: var(--ink-1) !important; }
.cover--rr .cv-t { color: var(--ink-1) !important; margin: 4px 0 8px !important; }
.cover--rr .cv-meta { color: var(--ink-2) !important; }
.cover--rr .credit { position: absolute; top: 8px; right: 8px; bottom: auto; }

/* ---------- headline rows: text left, square photo right (Apple News list) ---------- */
.cvl { margin: 8px var(--gutter) 0 !important; padding: 0 !important; background: transparent !important; }
.cvl__i { display: flex !important; flex-direction: row-reverse !important; align-items: flex-start !important; gap: 12px !important;
  padding: 12px 0 !important; border-top: 0 !important; border-bottom: .5px solid var(--rule) !important; background: transparent !important; }
.cvl__i:last-child { border-bottom: 0 !important; }
.cvl__img { flex: 0 0 84px !important; width: 84px !important; height: 84px !important; border-radius: 8px !important; object-fit: cover;
  border: 0 !important; box-shadow: none !important; background: var(--surface-2) !important; }
span.cvl__img { display: none !important; }
.cvl__b { flex: 1 1 auto; display: flex !important; flex-direction: column; gap: 3px; }
.cvl__t { color: var(--ink-1) !important; font-family: var(--f-head) !important; }

/* ---------- cards and sections: Apple grouped surfaces, no tinted blocks, no coloured edges ---------- */
.ch, .sec, .bm, .dk, .tk, .wire, .lines3, .ask, .livemap, .wash { border: 0 !important; border-left: 0 !important; box-shadow: none !important; }

.opener .kick { display: none !important; }
.bm, .dk, .tk, .wire, .lines3 { margin-top: 28px !important; }

.dz__st { border: 0 !important; background: var(--fill-2) !important; border-radius: 8px !important; color: var(--ink-1) !important; }
.dz__ph { margin: 0 !important; }
.dk__head, .tk__head, .wire__head, .bm__head { padding-left: var(--gutter); padding-right: var(--gutter); }

.tk__i { background: var(--card) !important; border: 0 !important; border-radius: 12px !important; margin-right: 10px; }
.tk__all { color: var(--accent) !important; font-weight: 600; font-size: 15px; }
.more { color: var(--accent) !important; font-weight: 600 !important; font-size: 15px !important; }
.truth { border-radius: 6px !important; font-size: 12px !important; font-weight: 600 !important; letter-spacing: 0 !important; }
.tile { background: var(--card) !important; border: 0 !important; border-radius: 12px !important; }
.wl, .wr, .l3 { border-color: var(--rule) !important; }

[class*="h-"] { border-left-color: transparent; }

/* ---------- the bar: ONE Today button bottom-left; tap → four tabs along the bottom (iOS 26 floating tab bar) ---------- */
.wm-tabs::before { height: calc(84px + env(safe-area-inset-bottom)) !important; background: linear-gradient(to top, var(--bg) 30%, color-mix(in srgb, var(--bg) 0%, transparent)) !important; }
.wm-tabs .wm-bar__dock { max-width: none !important; margin: 0 !important; padding: 0 12px calc(12px + env(safe-area-inset-bottom)) !important;
  display: flex !important; flex-direction: row !important; align-items: flex-end !important; justify-content: flex-start !important; gap: 8px; }
.wm-tabs .wm-pill { order: 0; flex: 0 0 auto; height: 54px !important; padding: 0 18px 0 14px !important; gap: 7px !important; border-radius: 27px !important;
  background: var(--glass) !important; border: .5px solid var(--glass-line) !important;
  -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8);
  box-shadow: 0 8px 28px rgba(0, 0, 0, .28); color: var(--ink-1) !important; width: auto !important; transition: transform .18s ease !important; }
.wm-tabs .wm-pill:active { transform: scale(.96); }

.wm-tabs .wm-pill__dot, .wm-tabs .wm-pill__crumb { display: none !important; }
.wm-tabs .wm-pill__label { font-family: var(--f-ui) !important; font-size: 15px !important; font-weight: 600 !important; line-height: 1 !important; letter-spacing: -.01em; }
.wm-tabs .wm-pill .wm-ic { width: 22px; height: 22px; }
.wm-tabs.is-mini:not(.is-open) .wm-pill { width: 54px !important; height: 54px !important; padding: 0 !important; justify-content: center !important; }
.wm-tabs.is-mini:not(.is-open) .wm-pill__label { display: none !important; }

.wm-tabs .wm-sheet { order: 1; flex: 1 1 auto; width: auto !important; max-height: none !important; overflow: visible !important; margin: 0 !important; padding: 0 6px !important;
  height: 54px; border-radius: 27px !important; background: var(--glass) !important; border: .5px solid var(--glass-line) !important;
  -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8); box-shadow: 0 8px 28px rgba(0, 0, 0, .28);
  transform-origin: 0 50% !important; transform: translateX(-24px) scale(.9) !important; opacity: 0 !important; visibility: hidden !important;
  transition: transform .26s cubic-bezier(.2, .9, .25, 1.15), opacity .18s ease, visibility 0s .26s !important; }
.wm-tabs.is-open .wm-sheet { transform: none !important; opacity: 1 !important; visibility: visible !important; transition: transform .26s cubic-bezier(.2, .9, .25, 1.15), opacity .18s ease !important; }
.wm-tabs .wm-sheet__grid { display: grid !important; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 100%; gap: 0; }
.wm-tabs .wm-tab { all: unset; box-sizing: border-box; display: flex !important; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 54px; min-width: 0; padding: 0 2px; border-radius: 22px; color: var(--ink-1); cursor: pointer; -webkit-tap-highlight-color: transparent; }
