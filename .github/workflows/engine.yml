name: Engine
# Every hour. The full edition (morning mode) every 3 hours at 01,04,07,10,13,16,19,22 UTC; the live doc + photos in between.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: hourly or morning
        default: hourly
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: engine
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      - name: Pick mode
        id: m
        run: |
          M="${{ github.event.inputs.mode }}"
          if [ -z "$M" ]; then
            if [ $((10#$(date -u +%H) % 3)) = 1 ]; then M=morning; else M=hourly; fi
          fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"
      - name: Run engine
        working-directory: engine
        run: python3 engine.py --mode ${{ steps.m.outputs.mode }} --out out/${{ steps.m.outputs.mode }} --state ../state
      - name: Test
        working-directory: engine
        continue-on-error: true
        run: python3 test_engine.py --out out/${{ steps.m.outputs.mode }}
      - name: Export to the site
        run: python3 tools/export.py --out engine/out/${{ steps.m.outputs.mode }}
      - name: Save data
        run: |
          git config user.name "watchman-engine"
          git config user.email "watchman-engine@users.noreply.github.com"
          git add site/data site/img state
          git commit -m "data: ${{ steps.m.outputs.mode }} run $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no change"
          git pull --rebase -X ours origin main || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
